<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" font-family="Roboto, Segoe UI, Arial, sans-serif">
  <rect width="900" height="430" rx="18" fill="#14181E"/>
  <text x="30" y="44" fill="#EDF0F4" font-size="22" font-weight="700">JK inverter BMS → USB-RS485 → Home Assistant</text>
  <text x="30" y="68" fill="#8C95A2" font-size="14">RS485-2 port (parallel port, RJ45) · 115200 baud 8N1 · DIP 0 = master, 1–15 = slaves</text>

  <!-- packs -->
  <g font-size="14" fill="#EDF0F4">
    <g transform="translate(30,100)">
      <rect width="190" height="120" rx="12" fill="#1C2129" stroke="#2A303A"/>
      <text x="16" y="28" font-weight="700">Pack 1</text><text x="16" y="48" fill="#8C95A2">DIP 0000 → address 0</text>
      <rect x="16" y="66" width="70" height="38" rx="5" fill="#1F4D3A" stroke="#2E6B52"/><text x="22" y="90" font-size="12">RS485-2</text>
      <rect x="104" y="66" width="70" height="38" rx="5" fill="#1F4D3A" stroke="#2E6B52"/><text x="110" y="90" font-size="12">RS485-2</text>
    </g>
    <g transform="translate(270,100)">
      <rect width="190" height="120" rx="12" fill="#1C2129" stroke="#2A303A"/>
      <text x="16" y="28" font-weight="700">Pack 2</text><text x="16" y="48" fill="#8C95A2">DIP 1000 → address 1</text>
      <rect x="16" y="66" width="70" height="38" rx="5" fill="#1F4D3A" stroke="#2E6B52"/><text x="22" y="90" font-size="12">RS485-2</text>
      <rect x="104" y="66" width="70" height="38" rx="5" fill="#1F4D3A" stroke="#2E6B52"/><text x="110" y="90" font-size="12">RS485-2</text>
    </g>
    <g transform="translate(510,100)">
      <rect width="190" height="120" rx="12" fill="#1C2129" stroke="#2A303A"/>
      <text x="16" y="28" font-weight="700">Pack 3</text><text x="16" y="48" fill="#8C95A2">DIP 0100 → address 2</text>
      <rect x="16" y="66" width="70" height="38" rx="5" fill="#1F4D3A" stroke="#2E6B52"/><text x="22" y="90" font-size="12">RS485-2</text>
      <rect x="104" y="66" width="70" height="38" rx="5" fill="#2A303A" stroke="#5AA9FF" stroke-width="2"/><text x="110" y="90" font-size="12">RS485-2</text>
    </g>
  </g>
  <!-- patch cables between packs -->
  <path d="M164 204 C 190 250, 270 250, 300 204" stroke="#5AA9FF" stroke-width="4" fill="none"/>
  <path d="M404 204 C 430 250, 510 250, 540 204" stroke="#5AA9FF" stroke-width="4" fill="none"/>
  <text x="182" y="268" fill="#8C95A2" font-size="12">CAT5/6 patch cable</text>
  <text x="422" y="268" fill="#8C95A2" font-size="12">CAT5/6 patch cable</text>
  <!-- adapter -->
  <path d="M649 204 C 660 280, 720 300, 760 300" stroke="#45D69A" stroke-width="4" fill="none"/>
  <rect x="760" y="280" width="110" height="44" rx="8" fill="#1C2129" stroke="#45D69A"/>
  <text x="772" y="300" fill="#EDF0F4" font-size="13" font-weight="700">USB-RS485</text>
  <text x="772" y="316" fill="#8C95A2" font-size="11">FTDI FT232R</text>
  <path d="M815 280 L815 230" stroke="#8C95A2" stroke-width="3"/>
  <rect x="770" y="190" width="90" height="40" rx="8" fill="#1C2129" stroke="#2A303A"/>
  <text x="780" y="215" fill="#EDF0F4" font-size="12">Home Assistant</text>

  <!-- pinout -->
  <g transform="translate(30,300)">
    <text x="0" y="0" fill="#EDF0F4" font-size="15" font-weight="700">RJ45 on RS485-2 (JK manual V19)</text>
    <g font-size="13">
      <rect x="0" y="14" width="18" height="18" rx="3" fill="#F2F2F2"/><rect x="0" y="14" width="18" height="6" fill="#F28C28"/>
      <text x="26" y="28" fill="#EDF0F4">pin 1 → <tspan font-weight="700">B (D−)</tspan>  <tspan fill="#8C95A2">white-orange (T568B)</tspan></text>
      <rect x="0" y="42" width="18" height="18" rx="3" fill="#F28C28"/>
      <text x="26" y="56" fill="#EDF0F4">pin 2 → <tspan font-weight="700">A (D+)</tspan>  <tspan fill="#8C95A2">orange</tspan></text>
      <rect x="0" y="70" width="18" height="18" rx="3" fill="#F2F2F2"/><rect x="0" y="70" width="18" height="6" fill="#3BAA4A"/>
      <text x="26" y="84" fill="#EDF0F4">pin 3 → <tspan font-weight="700">GND</tspan>  <tspan fill="#8C95A2">white-green</tspan></text>
    </g>
    <text x="330" y="28" fill="#8C95A2" font-size="13">Pins 7 = A, 8 = B, 6 = GND carry the same bus.</text>
    <text x="330" y="56" fill="#8C95A2" font-size="13">Not RS485-1 / CAN: that port talks to the inverter.</text>
    <text x="330" y="84" fill="#8C95A2" font-size="13">Nothing comes in? Swap A and B.</text>
  </g>
</svg>
