name: Release

on:
  release:
    types: [published]

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check manifest version matches tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          MANIFEST=$(python3 -c "import json;print(json.load(open('custom_components/jk_bms_smart/manifest.json'))['version'])")
          test "$TAG" = "$MANIFEST" || (echo "Tag $TAG does not match manifest $MANIFEST" && exit 1)
