create_dashboard:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: jk_bms_smart
set_setting:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          integration: jk_bms_smart
    key:
      required: true
      selector:
        select:
          options:
            - charge_switch
            - discharge_switch
            - balance_switch
            - cell_ovp
            - cell_ovpr
            - cell_uvp
            - cell_uvpr
            - charge_voltage
            - float_voltage
            - soc100_voltage
            - soc0_voltage
            - power_off_voltage
            - balance_trigger
            - balance_start
            - max_balance_current
            - max_charge_current
            - max_discharge_current
            - design_capacity_ah
            - charge_ot
            - discharge_ot
            - charge_ut
            - mos_ot
            - charge_otpr
            - discharge_otpr
            - charge_utpr
            - mos_otpr
            - charge_ocp_delay
            - charge_ocp_recovery
            - discharge_ocp_delay
            - discharge_ocp_recovery
            - scp_recovery
            - smart_sleep_voltage
    value:
      required: true
      selector:
        number:
          min: -30
          max: 2000
          step: any
          mode: box
    all_packs:
      required: false
      default: false
      selector:
        boolean:
copy_settings:
  fields:
    source:
      required: true
      selector:
        entity:
          integration: jk_bms_smart
    targets:
      required: false
      selector:
        entity:
          integration: jk_bms_smart
          multiple: true
    keys:
      required: false
      selector:
        text:
          multiple: true
    include_capacity:
      required: false
      default: false
      selector:
        boolean:
    dry_run:
      required: false
      default: false
      selector:
        boolean:
backup_settings:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          integration: jk_bms_smart
restore_settings:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          integration: jk_bms_smart
    file:
      required: true
      selector:
        text:
    include_switches:
      required: false
      default: false
      selector:
        boolean:
    dry_run:
      required: false
      default: false
      selector:
        boolean:
reset_cell_statistics:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          integration: jk_bms_smart
